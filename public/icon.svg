<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background dengan rounded corner khas launcher icon -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />

  <!-- Logo EduAbsen: Topi Akademik + Buku + Centang Presensi -->
  <g filter="url(#shadow)" transform="translate(64, 64) scale(0.75)">
    <!-- Topi Wisuda / Akademik -->
    <path
      d="M256 70 L48 180 L256 290 L464 180 Z"
      fill="#ffffff"
    />
    <!-- Rumbai / Tassel -->
    <path
      d="M410 205 L410 320 C410 330 395 330 395 320 L395 214 Z"
      fill="#fde047"
    />
    <circle cx="402" cy="330" r="10" fill="#fde047" />

    <!-- Penutup Bawah Topi -->
    <path
      d="M120 220 L120 320 C120 380 392 380 392 320 L392 220 C350 250 300 270 256 270 C212 270 162 250 120 220 Z"
      fill="#e0e7ff"
      opacity="0.95"
    />

    <!-- Lingkaran Badge Presensi -->
    <circle cx="256" cy="380" r="64" fill="#ffffff" />
    <circle cx="256" cy="380" r="54" fill="#10b981" />

    <!-- Centang Verifikasi Kehadiran -->
    <path
      d="M236 384 L248 396 L278 364"
      fill="none"
      stroke="#ffffff"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
